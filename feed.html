        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea { -webkit-user-select: text; user-select: text; }

        html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            margin: 0 auto;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --bg-primary: #000;
            --glass-bg: rgba(255,255,255,.05);
            --glass-border: rgba(255,255,255,.1);
            --text-primary: #999;
            --text-secondary: #888;
            --text-tertiary: #666;
        }

        .icon-gray { filter: invert(60%) sepia(0%) saturate(0%) brightness(100%) contrast(100%); }

        /* ── HEADER ── */
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #000;
        }
        .header-inner {
            max-width: 95%;
            margin: 0 auto;
            padding: 8px 12px;
            backdrop-filter: saturate(180%) blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            height: 50px;
            overflow: hidden;
        }
        .logo {
            width: 100px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .logo img {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .header-login-btn {
            width: 32px; height: 32px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all .15s ease;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .header-login-btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
        .header-login-btn img { width: 12px; height: 12px; }

        /* ── MODULES BLOCK ── */
        /* ── MAIN AREA ── */
        .main-area {
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }

        /* ── MODULES BLOCK — абсолютно поверх фида ── */
        .modules-wrap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 10px 2.5% 8px;
            box-sizing: border-box;
            background: transparent;
            pointer-events: none;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 8px;
            padding: 7px 7px 7px 22px;
            box-sizing: border-box;
            width: 100%;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            overflow: clip;
            pointer-events: all;
            transition: background .15s ease, backdrop-filter .15s ease, -webkit-backdrop-filter .15s ease;
        }
        .modules-grid.scrolled {
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }

        /* lottie иконки в панели */
        .module-btn dotlottie-player,
        .module-btn lottie-player {
            width: 22px; height: 22px;
            filter: brightness(0) invert(1);
            pointer-events: none;
        }
        .lottie-icon {
            width: 20px; height: 20px;
            filter: brightness(10) saturate(0);
            pointer-events: none;
        }
        .icon-white {
            width: 18px; height: 18px;
            filter: brightness(0) invert(1);
            opacity: .6;
            pointer-events: none;
        }
        @keyframes giftBorderShimmer {
            0%   { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .module-btn {
            aspect-ratio: 1;
            background: rgba(255,255,255,.03);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: background .2s ease;
            max-height: 52px;
            position: relative;
            isolation: isolate;
            border: none;
        }
        .module-btn > * { position: relative; z-index: 1; }
        .module-btn::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,.04) 0%,
                rgba(255,255,255,.04) 30%,
                rgba(255,255,255,.28) 48%,
                rgba(255,255,255,.38) 50%,
                rgba(255,255,255,.28) 52%,
                rgba(255,255,255,.04) 70%,
                rgba(255,255,255,.04) 100%
            );
            background-size: 400% 400%;
            animation: giftBorderShimmer 5s linear infinite;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }
        /* каждая кнопка стартует в разное время */
        .module-btn:nth-child(1)::before { animation-delay: 0s; }
        .module-btn:nth-child(2)::before { animation-delay: -1.1s; }
        .module-btn:nth-child(3)::before { animation-delay: -2.7s; }
        .module-btn:nth-child(4)::before { animation-delay: -0.6s; }
        .module-btn:nth-child(5)::before { animation-delay: -3.8s; }

        .module-btn:hover, .module-btn:active {
            background: rgba(255,255,255,.08);
        }
        /* active — тот же цвет фона что и остальные, только обводка чуть ярче */
        .module-btn.active {
            background: rgba(255,255,255,.03);
        }
        .module-btn.active::before {
            background: linear-gradient(
                135deg,
                rgba(255,255,255,.06) 0%,
                rgba(255,255,255,.06) 30%,
                rgba(255,255,255,.45) 48%,
                rgba(255,255,255,.55) 50%,
                rgba(255,255,255,.45) 52%,
                rgba(255,255,255,.06) 70%,
                rgba(255,255,255,.06) 100%
            );
            background-size: 400% 400%;
            animation: giftBorderShimmer 5s linear infinite;
        }
        .module-btn img {
            width: 14px; height: 14px;
        }

        /* ── FEED SECTION ── */
        .scroll-root {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            clip-path: inset(48px 0 0 0);
        }
        .scroll-root::-webkit-scrollbar { display: none; }
        .feed-wrap {
            padding: 88px 2.5% 24px;
            background: #000;
        }

        /* ── POST CARD ── */
        .post-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            transition: border-color .2s ease;
        }
        .post-card:hover { border-color: rgba(255,255,255,.18); }

        /* header row: title left, date right */
        .post-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 8px;
        }
        .post-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
            margin-right: 10px;
        }
        .post-date {
            font-size: 10px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        /* carousel wrapper */
        .post-carousel {
            padding: 0 10px;
            position: relative;
        }

        /* the framed image area */
        .carousel-frame {
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1;
            background: rgba(255,255,255,.03);
        }

        /* slides strip */
        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform .35s cubic-bezier(.4,0,.2,1);
        }
        .carousel-slide {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
        }
        .carousel-slide img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .carousel-slide video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* dot indicators */
        .carousel-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 8px 0 4px;
        }
        .carousel-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            transition: background .2s ease, transform .2s ease;
            cursor: pointer;
        }
        .carousel-dot.active {
            background: var(--text-secondary);
            transform: scale(1.2);
        }
        /* hide dots if only 1 slide */
        .carousel-dots.single { display: none; }

        /* отступ снизу если нет точек (одиночный слайд) */
        .has-single-slide .post-carousel {
            padding-bottom: 20px;
        }

        /* caption */
        .post-caption { display: none; }

        /* ── LOAD MORE ── */

        /* scrollbar */
        body::-webkit-scrollbar { width: 4px; }
        body::-webkit-scrollbar-track { background: transparent; }
        body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }
    </style>
</head>

const CAPTION_MAX = 100;
let visible = 13;

function buildPost(p) {
    const short   = p.caption && p.caption.length > CAPTION_MAX;
    const capText = short ? p.caption.slice(0, CAPTION_MAX) + '…' : p.caption;
    const count   = p.images.length;

    const slides = p.images.map(item => {
        if (item && typeof item === 'object' && item.type === 'video') {
            return `<div class="carousel-slide"><video src="${item.src}" playsinline loop muted preload="metadata"></video></div>`;
        }
        return `<div class="carousel-slide"><img src="${item}" alt="" loading="lazy"></div>`;
    }).join('');

    const dots = count > 1
        ? `<div class="carousel-dots" id="dots-${p.id}">
            ${p.images.map((_, i) =>
                `<div class="carousel-dot ${i===0?'active':''}" data-post="${p.id}" data-idx="${i}"></div>`
            ).join('')}
           </div>`
        : `<div class="carousel-dots single"></div>`;

    return `
    <article class="post-card${count === 1 ? ' has-single-slide' : ''}" data-id="${p.id}">
        <div class="post-top">
            <span class="post-title">${p.title}</span>
            <span class="post-date">${p.date}</span>
        </div>
        <div class="post-carousel">
            <div class="carousel-frame">
                <div class="carousel-track" id="track-${p.id}" data-current="0" data-count="${count}">
                    ${slides}
                </div>
            </div>
            ${dots}
        </div>
        ${p.caption ? `
        <div class="post-caption">
            <span class="cap-body">${capText}</span>
            ${short ? `<span class="post-caption-more" data-id="${p.id}"> ещё</span>` : ''}
        </div>` : ''}
    </article>`;
}

function goToSlide(postId, idx) {
    const track = document.getElementById(`track-${postId}`);
    if (!track) return;
    const count = +track.dataset.count;
    idx = Math.max(0, Math.min(idx, count - 1));
    track.dataset.current = idx;
    track.style.transform = `translateX(-${idx * 100}%)`;
    // update dots
    const dotsEl = document.getElementById(`dots-${postId}`);
    if (dotsEl) {
        dotsEl.querySelectorAll('.carousel-dot').forEach((d, i) => {
            d.classList.toggle('active', i === idx);
        });
    }
    // play/pause video slides
    track.querySelectorAll('.carousel-slide').forEach((slide, i) => {
        const video = slide.querySelector('video');
        if (!video) return;
        if (i === idx) { video.play(); } else { video.pause(); video.currentTime = 0; }
    });
}

// touch swipe
let touchStartX = 0;
let touchPostId = null;

function render() {
    document.getElementById('feedContainer').innerHTML =
        feedData.slice(0, visible).map(buildPost).join('');
}

document.addEventListener('click', e => {
    // dot click
    const dot = e.target.closest('.carousel-dot');
    if (dot) {
        goToSlide(+dot.dataset.post, +dot.dataset.idx);
        return;
    }
    // caption more
    const more = e.target.closest('.post-caption-more');
    if (more) {
        const p = feedData.find(x => x.id === +more.dataset.id);
        if (p) {
            more.closest('.post-caption').querySelector('.cap-body').textContent = p.caption;
            more.remove();
        }
    }
});

// swipe support
document.addEventListener('touchstart', e => {
    const frame = e.target.closest('.carousel-frame');
    if (!frame) return;
    touchStartX = e.touches[0].clientX;
    touchPostId = +frame.closest('.post-card').dataset.id;
}, { passive: true });

document.addEventListener('touchend', e => {
    if (touchPostId === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 30) { touchPostId = null; return; }
    const track = document.getElementById(`track-${touchPostId}`);
    if (!track) { touchPostId = null; return; }
    const cur = +track.dataset.current;
    goToSlide(touchPostId, dx < 0 ? cur + 1 : cur - 1);
    touchPostId = null;
}, { passive: true });

render();

// инициализация Lottie анимаций
document.querySelectorAll('.lottie-icon').forEach(el => {
    lottie.loadAnimation({
        container: el,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: el.dataset.src
    });
});

// панель модулей: прозрачная → блюр при скролле
const scrollRoot = document.querySelector('.scroll-root');
const modulesGrid = document.querySelector('.modules-grid');
scrollRoot.addEventListener('scroll', () => {
    if (scrollRoot.scrollTop > 10) {
        modulesGrid.classList.add('scrolled');
    } else {
        modulesGrid.classList.remove('scrolled');
    }
}, { passive: true });

function goToMain() {
    const ua = navigator.userAgent;
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    window.location.href = isMobile ? 'https://mse.zone/mobile' : 'https://mse.zone';
}а
