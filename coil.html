<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MSE Task Organizer</title>
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/CakeBoxDeveloper/MSE/f9cf4d0f418e37fb1154fa7a2d314034985bbd37/MSESVGWhite.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v10 modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, serverTimestamp, query, where, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyAC8pTGZB2toqkCf_I55V6O0WMCdYF8FtI",
            authDomain: "mse-base.firebaseapp.com",
            projectId: "mse-base",
            storageBucket: "mse-base.firebasestorage.app",
            messagingSenderId: "686311511188",
            appId: "1:686311511188:web:04d99e5fb815ae444d9081"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.firebaseDB = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseGetDoc = getDoc;
        window.firebaseUpdateDoc = updateDoc;
        window.firebaseCollection = collection;
        window.firebaseServerTimestamp = serverTimestamp;
        window.firebaseQuery = query;
        window.firebaseWhere = where;
        window.firebaseGetDocs = getDocs;
        window.firebaseDeleteDoc = deleteDoc;
        
        console.log('Firebase initialized for Task Organizer');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        input, textarea, [contenteditable] {
            -webkit-user-select: text;
            user-select: text;
        }
        
        html {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 430px;
            height: 100vh;
            position: relative;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #999;
            -webkit-font-smoothing: antialiased;
        }
        
        :root {
            --bg-primary: #000;
            --glass-bg: rgba(255,255,255,.05);
            --glass-border: rgba(255,255,255,.1);
            --text-primary: #999;
            --text-secondary: #888;
            --text-tertiary: #666;
            --priority-high: #ff4444;
            --priority-medium: #ffaa44;
            --priority-low: #44ff44;
        }
        
        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0;
            background: transparent;
        }
        
        .header-inner {
            max-width: 95%;
            margin: 0 auto;
            padding: 8px 12px;
            backdrop-filter: saturate(180%) blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            height: 50px;
        }
        
        .logo {
            width: 100px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .logo img {
            width: 160px;
            height: 56px;
            object-fit: contain;
        }
        
        .header-login-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .header-login-btn:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }
        
        .header-login-btn img {
            width: 12px;
            height: 12px;
        }
        
        /* Main Layout */
        .main-wrapper {
            margin-top: 0;
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 20px;
            height: calc(100vh - 78px);
            padding-top: 8px;
        }
        
        /* Task Organizer Block */
        .content-block {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            backdrop-filter: saturate(180%) blur(20px);
            width: 95%;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
            transition: flex 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            will-change: flex;
        }
        
        .content-block#organizerBlock {
            margin-top: 0;
        }
        
        .content-block#chatBlock {
            margin-top: 8px;
        }
        
        .content-block#organizerBlock.collapsed {
            flex: 0 0 58px;
        }
        
        .content-block#chatBlock.collapsed {
            flex: 0 0 58px;
        }
        
        .block-spacer {
            flex: 0 0 0px;
            min-height: 0;
            transition: flex 0.8s cubic-bezier(0.4, 0, 0.2, 1), min-height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: flex, min-height;
        }
        
        .content-grid.both-collapsed .block-spacer {
            flex: 1 1 0%;
            min-height: 100px;
        }
        
        .block-body {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: visible;
            filter: blur(0px);
            opacity: 1;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }
        
        /* Inner Tabs */
        .inner-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: visible;
            scrollbar-width: none;
        }
        
        .inner-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .btn-minimize {
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s ease;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            margin-left: auto;
        }
        
        .btn-minimize:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }
        
        .btn-minimize img {
            width: 12px;
            height: 12px;
        }
        
        .btn-minimize .icon-minimize {
            display: block;
        }
        
        .btn-minimize .icon-maximize {
            display: none;
        }
        
        .content-block.collapsed .btn-minimize .icon-minimize {
            display: none;
        }
        
        .content-block.collapsed .btn-minimize .icon-maximize {
            display: block;
        }
        
        .content-block.collapsed .block-body {
            padding: 12px 12px 0 12px;
        }
        
        .content-block.collapsed .inner-tabs {
            margin-bottom: 12px;
        }
        
        .content-block.collapsed .content-body {
            height: 0;
            min-height: 0;
            margin: 0;
            padding: 0;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1), min-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), filter 0.8s ease, opacity 0.8s ease;
        }
        
        .content-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: visible;
            overflow-x: hidden;
            transition: filter 0.8s ease, opacity 0.8s ease;
            scrollbar-width: none;
            filter: blur(0px);
            opacity: 1;
            width: 100%;
        }
        
        .content-body::-webkit-scrollbar {
            display: none;
        }
        
        /* Task Tabs */
        .task-tabs-container {
            padding: 8px 12px 0 12px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 8px;
        }
        
        .task-tabs-container::-webkit-scrollbar {
            display: none;
        }
        
        .task-tab {
            min-width: 120px;
            height: 32px;
            padding: 0 12px;
            background: transparent;
            border: 1px solid var(--text-secondary);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .task-tab.active {
            background: var(--text-secondary);
            color: var(--bg-primary);
            border-color: var(--text-secondary);
        }
        
        .task-tab:hover:not(.active) {
            border-color: rgba(255,255,255,.3);
        }
        
        .task-tab-close {
            width: 14px;
            height: 14px;
            opacity: 0.5;
            transition: opacity .15s ease;
        }
        
        .task-tab-close:hover {
            opacity: 1;
        }
        
        .task-tab.active .task-tab-close {
            filter: invert(1);
        }
        
        .add-task-btn {
            min-width: 32px;
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .add-task-btn:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }
        
        /* Task Tree */
        .task-tree-container {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            scrollbar-width: none;
        }
        
        .task-tree-container::-webkit-scrollbar {
            display: none;
        }
        
        .task-item {
            margin-bottom: 8px;
            padding: 10px 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: all .15s ease;
        }
        
        .task-item:hover {
            background: rgba(255,255,255,.05);
        }
        
        .task-item.completed {
            opacity: 0.5;
        }
        
        .task-checkbox {
            width: 18px;
            height: 18px;
            min-width: 18px;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s ease;
        }
        
        .task-checkbox.checked {
            background: var(--text-secondary);
            border-color: var(--text-secondary);
        }
        
        .task-checkbox.checked::after {
            content: '✓';
            color: var(--bg-primary);
            font-size: 12px;
            font-weight: bold;
        }
        
        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .task-title {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.4;
        }
        
        .task-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .task-priority {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }
        
        .task-priority.high {
            background: rgba(255,68,68,.2);
            color: var(--priority-high);
            border: 1px solid var(--priority-high);
        }
        
        .task-priority.medium {
            background: rgba(255,170,68,.2);
            color: var(--priority-medium);
            border: 1px solid var(--priority-medium);
        }
        
        .task-priority.low {
            background: rgba(68,255,68,.2);
            color: var(--priority-low);
            border: 1px solid var(--priority-low);
        }
        
        .task-subtasks {
            margin-left: 28px;
            margin-top: 8px;
            padding-left: 12px;
            border-left: 2px solid var(--glass-border);
        }
        
        /* Chat Block */
        .chat-block {
            /* Стили перенесены в .content-block */
        }
        
        .chat-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--glass-border);
            display: none;
        }
        
        .chat-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .chat-messages {
            flex: 1;
            padding: 0;
            margin-bottom: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }
        
        .chat-messages::-webkit-scrollbar {
            display: none;
        }
        
        .chat-message {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        
        .chat-message.user {
            flex-direction: row-reverse;
        }
        
        .chat-avatar {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-primary);
        }
        
        .chat-bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-primary);
        }
        
        .chat-message.user .chat-bubble {
            background: rgba(255,255,255,.1);
            border: 1px solid var(--glass-border);
        }
        
        .chat-message.ai .chat-bubble {
            background: rgba(255,255,255,.05);
            border: 1px solid var(--glass-border);
        }
        
        .chat-input-container {
            padding: 0;
            border-top: none;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-top: auto;
        }
        
        .content-block.collapsed .chat-input-container {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--glass-border);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            resize: none;
            max-height: 80px;
            min-height: 40px;
            height: 40px;
            transition: all .2s ease;
        }
        
        .chat-input::placeholder {
            color: var(--text-tertiary);
        }
        
        .chat-input:focus {
            outline: none;
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }
        
        .chat-send-btn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--glass-border);
            border-radius: 5px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .chat-send-btn:hover {
            background: rgba(255,255,255,.1);
            border-color: rgba(255,255,255,.2);
        }
        
        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: var(--text-tertiary);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }
        
        .empty-state-icon {
            font-size: 48px;
            opacity: 0.3;
        }
        
        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/CakeBoxDeveloper/MSE/f9cf4d0f418e37fb1154fa7a2d314034985bbd37/MSESVGWhite.svg" alt="MSE">
            </div>
            <button class="header-login-btn" onclick="handleLogin()">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Login">
            </button>
        </div>
    </header>
    
    <!-- Main Content -->
    <div class="main-wrapper">
        <div class="content-grid">
            <!-- Task Organizer Block -->
            <div class="content-block" id="organizerBlock">
                <div class="block-body">
                    <div class="inner-tabs">
                        <div class="task-tabs-container" style="border: none; padding: 0; margin: 0; flex: 1; overflow-x: auto;">
                            <button class="add-task-btn" onclick="createNewTask()">+</button>
                        </div>
                        <button class="btn-minimize" onclick="toggleBlock('organizerBlock')">
                            <img class="icon-minimize" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z'/%3E%3C/svg%3E" alt="Minimize">
                            <img class="icon-maximize" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z'/%3E%3C/svg%3E" alt="Maximize">
                        </button>
                    </div>
                    <div class="content-body">
                        <div class="task-tree-container" id="taskTreeContainer">
                            <div class="empty-state">
                                <div class="empty-state-icon">📋</div>
                                <div>Нет активных задач<br>Опишите задачу в чате ниже</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="block-spacer"></div>
            
            <!-- Chat Block -->
            <div class="content-block" id="chatBlock">
                <div class="block-body">
                    <div class="inner-tabs">
                        <div style="font-size: 13px; font-weight: 600; color: var(--text-primary); flex: 1;">AI Ассистент</div>
                        <button class="btn-minimize" onclick="toggleBlock('chatBlock')">
                            <img class="icon-minimize" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z'/%3E%3C/svg%3E" alt="Minimize">
                            <img class="icon-maximize" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z'/%3E%3C/svg%3E" alt="Maximize">
                        </button>
                    </div>
                    <div class="content-body">
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-message ai">
                                <div class="chat-avatar">AI</div>
                                <div class="chat-bubble">
                                    Привет! Я помогу организовать твои задачи. Опиши что нужно сделать, и я разобью это на подзадачи с приоритетами.
                                </div>
                            </div>
                        </div>
                        <div class="chat-input-container">
                            <textarea class="chat-input" id="chatInput" placeholder="Опишите задачу..." rows="1"></textarea>
                            <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23999'%3E%3Cpath d='M2.01 21L23 12 2.01 3 2 10l15 2-15 2z'/%3E%3C/svg%3E" alt="Send" style="width: 18px; height: 18px; opacity: 0.7;">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Global State
        let currentUser = null;
        let tasks = [];
        let activeTaskId = null;
        let chatHistory = [];
        
        // Toggle block minimize/maximize
        function toggleBlock(blockId) {
            const block = document.getElementById(blockId);
            const grid = document.querySelector('.content-grid');
            const organizerBlock = document.getElementById('organizerBlock');
            const chatBlock = document.getElementById('chatBlock');
            
            block.classList.toggle('collapsed');
            
            // Check if both blocks are collapsed
            const bothCollapsed = organizerBlock.classList.contains('collapsed') && 
                                 chatBlock.classList.contains('collapsed');
            
            if (bothCollapsed) {
                grid.classList.add('both-collapsed');
            } else {
                grid.classList.remove('both-collapsed');
            }
            
            // Add overflow hidden after animation
            setTimeout(() => {
                const contentBody = block.querySelector('.content-body');
                if (block.classList.contains('collapsed')) {
                    contentBody.style.overflow = 'hidden';
                } else {
                    contentBody.style.overflow = 'visible';
                }
            }, 800);
        }
        
        // Auto-resize textarea
        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });
        
        // Enter to send
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Login Handler
        function handleLogin() {
            const userId = prompt('Введите ID пользователя:');
            if (userId) {
                currentUser = { id: userId };
                loadUserTasks();
                alert('Вход выполнен!');
            }
        }
        
        // Load tasks from Firebase
        async function loadUserTasks() {
            if (!currentUser) return;
            
            try {
                const tasksRef = window.firebaseCollection(window.firebaseDB, 'tasks');
                const q = window.firebaseQuery(tasksRef, window.firebaseWhere('userId', '==', currentUser.id));
                const querySnapshot = await window.firebaseGetDocs(q);
                
                tasks = [];
                querySnapshot.forEach((doc) => {
                    tasks.push({ id: doc.id, ...doc.data() });
                });
                
                tasks.sort((a, b) => b.globalPriority - a.globalPriority);
                renderTaskTabs();
                if (tasks.length > 0) {
                    switchTask(tasks[0].id);
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }
        
        // Save task to Firebase
        async function saveTask(task) {
            if (!currentUser) return;
            
            try {
                const taskRef = window.firebaseDoc(window.firebaseDB, 'tasks', task.id);
                await window.firebaseSetDoc(taskRef, {
                    ...task,
                    userId: currentUser.id,
                    lastUpdated: window.firebaseServerTimestamp()
                }, { merge: true });
            } catch (error) {
                console.error('Error saving task:', error);
            }
        }
        
        // Delete task from Firebase
        async function deleteTask(taskId) {
            if (!currentUser) return;
            
            try {
                const taskRef = window.firebaseDoc(window.firebaseDB, 'tasks', taskId);
                await window.firebaseDeleteDoc(taskRef);
                tasks = tasks.filter(t => t.id !== taskId);
                renderTaskTabs();
                if (activeTaskId === taskId) {
                    activeTaskId = tasks.length > 0 ? tasks[0].id : null;
                    renderTaskTree();
                }
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }
        
        // Create new task
        function createNewTask() {
            const taskName = prompt('Название задачи:');
            if (!taskName) return;
            
            const newTask = {
                id: 'task_' + Date.now(),
                name: taskName,
                globalPriority: 50,
                items: [],
                completed: false,
                createdAt: Date.now()
            };
            
            tasks.push(newTask);
            saveTask(newTask);
            renderTaskTabs();
            switchTask(newTask.id);
        }
        
        // Switch active task
        function switchTask(taskId) {
            activeTaskId = taskId;
            renderTaskTabs();
            renderTaskTree();
        }
        
        // Render task tabs
        function renderTaskTabs() {
            const container = document.querySelector('.task-tabs-container');
            const addBtn = container.querySelector('.add-task-btn');
            
            container.querySelectorAll('.task-tab').forEach(tab => tab.remove());
            
            tasks.forEach(task => {
                const tab = document.createElement('div');
                tab.className = 'task-tab' + (task.id === activeTaskId ? ' active' : '');
                
                const taskName = document.createElement('span');
                taskName.textContent = task.name;
                taskName.style.flex = '1';
                taskName.style.overflow = 'hidden';
                taskName.style.textOverflow = 'ellipsis';
                
                const closeBtn = document.createElement('span');
                closeBtn.className = 'task-tab-close';
                closeBtn.textContent = '✕';
                closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTask(task.id);
                };
                
                tab.appendChild(taskName);
                tab.appendChild(closeBtn);
                tab.onclick = () => switchTask(task.id);
                
                container.insertBefore(tab, addBtn);
            });
        }
        
        // Render task tree
        function renderTaskTree() {
            const container = document.getElementById('taskTreeContainer');
            
            if (!activeTaskId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div>Нет активных задач<br>Опишите задачу в чате ниже</div>
                    </div>
                `;
                return;
            }
            
            const task = tasks.find(t => t.id === activeTaskId);
            if (!task || !task.items || task.items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div>Задача пока не разбита на этапы<br>Опишите детали в чате</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            renderTaskItems(task.items, container);
        }
        
        // Render task items recursively
        function renderTaskItems(items, container) {
            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'task-item' + (item.completed ? ' completed' : '');
                
                const priorityClass = item.priority >= 70 ? 'high' : item.priority >= 40 ? 'medium' : 'low';
                const priorityText = item.priority >= 70 ? 'Высокий' : item.priority >= 40 ? 'Средний' : 'Низкий';
                
                itemDiv.innerHTML = `
                    <div class="task-checkbox ${item.completed ? 'checked' : ''}" onclick="toggleTaskItem('${item.id}')"></div>
                    <div class="task-content">
                        <div class="task-title">${item.title}</div>
                        <div class="task-meta">
                            <span class="task-priority ${priorityClass}">${priorityText}</span>
                        </div>
                    </div>
                `;
                
                container.appendChild(itemDiv);
                
                if (item.subtasks && item.subtasks.length > 0) {
                    const subtasksDiv = document.createElement('div');
                    subtasksDiv.className = 'task-subtasks';
                    itemDiv.appendChild(subtasksDiv);
                    renderTaskItems(item.subtasks, subtasksDiv);
                }
            });
        }
        
        // Toggle task item completion
        function toggleTaskItem(itemId) {
            const task = tasks.find(t => t.id === activeTaskId);
            if (!task) return;
            
            function findAndToggle(items) {
                for (let item of items) {
                    if (item.id === itemId) {
                        item.completed = !item.completed;
                        return true;
                    }
                    if (item.subtasks && findAndToggle(item.subtasks)) {
                        return true;
                    }
                }
                return false;
            }
            
            findAndToggle(task.items);
            saveTask(task);
            renderTaskTree();
        }
        
        // Send message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addChatMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            
            // Show typing indicator
            const typingId = addTypingIndicator();
            
            // Process with AI
            setTimeout(async () => {
                removeTypingIndicator(typingId);
                await processAIResponse(message);
            }, 1500);
        }
        
        // Add chat message
        function addChatMessage(sender, text) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;
            
            const avatar = sender === 'user' ? 'Вы' : 'AI';
            
            messageDiv.innerHTML = `
                <div class="chat-avatar">${avatar}</div>
                <div class="chat-bubble">${text}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            chatHistory.push({ sender, text, timestamp: Date.now() });
        }
        
        // Add typing indicator
        function addTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            const typingId = 'typing_' + Date.now();
            typingDiv.id = typingId;
            typingDiv.className = 'chat-message ai';
            typingDiv.innerHTML = `
                <div class="chat-avatar">AI</div>
                <div class="chat-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return typingId;
        }
        
        // Remove typing indicator
        function removeTypingIndicator(typingId) {
            const typingDiv = document.getElementById(typingId);
            if (typingDiv) typingDiv.remove();
        }
        
        // Process AI response (mock implementation)
        async function processAIResponse(userMessage) {
            const lowerMessage = userMessage.toLowerCase();
            
            // Check if user is reporting completion
            if (lowerMessage.includes('сделал') || lowerMessage.includes('выполнил') || lowerMessage.includes('готово') || lowerMessage.includes('завершил')) {
                handleTaskCompletion(userMessage);
                return;
            }
            
            // Check if this is a new task or clarification
            if (!activeTaskId || lowerMessage.includes('новая задача') || lowerMessage.includes('создать задачу')) {
                handleNewTask(userMessage);
            } else {
                handleTaskClarification(userMessage);
            }
        }
        
        // Handle new task creation
        function handleNewTask(message) {
            // Extract task name from message
            let taskName = message;
            if (message.length > 50) {
                taskName = message.substring(0, 47) + '...';
            }
            
            // Ask clarifying questions
            const questions = [
                'Какой результат вы хотите получить?',
                'Есть ли дедлайн для этой задачи?',
                'Какие ресурсы у вас есть?'
            ];
            
            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
            
            // Create task structure
            const newTask = {
                id: 'task_' + Date.now(),
                name: taskName,
                globalPriority: 60,
                items: generateTaskPipeline(message),
                completed: false,
                createdAt: Date.now()
            };
            
            tasks.push(newTask);
            tasks.sort((a, b) => b.globalPriority - a.globalPriority);
            saveTask(newTask);
            renderTaskTabs();
            switchTask(newTask.id);
            
            addChatMessage('ai', `Отлично! Я создал задачу "${taskName}" и разбил её на этапы. ${randomQuestion}`);
        }
        
        // Generate task pipeline
        function generateTaskPipeline(message) {
            const lowerMessage = message.toLowerCase();
            
            // Example: "починить чайник"
            if (lowerMessage.includes('чайник') || lowerMessage.includes('починить')) {
                return [
                    {
                        id: 'item_1',
                        title: 'Диагностика проблемы',
                        priority: 80,
                        completed: false,
                        subtasks: [
                            { id: 'item_1_1', title: 'Проверить подключение к сети', priority: 75, completed: false, subtasks: [] },
                            { id: 'item_1_2', title: 'Осмотреть внешние повреждения', priority: 70, completed: false, subtasks: [] },
                            { id: 'item_1_3', title: 'Проверить нагревательный элемент', priority: 85, completed: false, subtasks: [] }
                        ]
                    },
                    {
                        id: 'item_2',
                        title: 'Подготовка инструментов',
                        priority: 60,
                        completed: false,
                        subtasks: [
                            { id: 'item_2_1', title: 'Отвертка', priority: 50, completed: false, subtasks: [] },
                            { id: 'item_2_2', title: 'Мультиметр', priority: 65, completed: false, subtasks: [] },
                            { id: 'item_2_3', title: 'Запасные детали (если нужны)', priority: 40, completed: false, subtasks: [] }
                        ]
                    },
                    {
                        id: 'item_3',
                        title: 'Ремонт',
                        priority: 90,
                        completed: false,
                        subtasks: [
                            { id: 'item_3_1', title: 'Разобрать чайник', priority: 70, completed: false, subtasks: [] },
                            { id: 'item_3_2', title: 'Заменить/починить неисправную деталь', priority: 95, completed: false, subtasks: [] },
                            { id: 'item_3_3', title: 'Собрать чайник обратно', priority: 75, completed: false, subtasks: [] }
                        ]
                    },
                    {
                        id: 'item_4',
                        title: 'Тестирование',
                        priority: 85,
                        completed: false,
                        subtasks: [
                            { id: 'item_4_1', title: 'Проверить работу чайника', priority: 90, completed: false, subtasks: [] },
                            { id: 'item_4_2', title: 'Убедиться в отсутствии протечек', priority: 80, completed: false, subtasks: [] }
                        ]
                    }
                ];
            }
            
            // Generic task structure
            return [
                {
                    id: 'item_1',
                    title: 'Планирование и подготовка',
                    priority: 70,
                    completed: false,
                    subtasks: [
                        { id: 'item_1_1', title: 'Определить цели и требования', priority: 75, completed: false, subtasks: [] },
                        { id: 'item_1_2', title: 'Собрать необходимые ресурсы', priority: 60, completed: false, subtasks: [] }
                    ]
                },
                {
                    id: 'item_2',
                    title: 'Выполнение основной работы',
                    priority: 85,
                    completed: false,
                    subtasks: [
                        { id: 'item_2_1', title: 'Начать выполнение', priority: 80, completed: false, subtasks: [] },
                        { id: 'item_2_2', title: 'Контроль качества', priority: 70, completed: false, subtasks: [] }
                    ]
                },
                {
                    id: 'item_3',
                    title: 'Завершение и проверка',
                    priority: 75,
                    completed: false,
                    subtasks: [
                        { id: 'item_3_1', title: 'Финальная проверка', priority: 80, completed: false, subtasks: [] },
                        { id: 'item_3_2', title: 'Документирование результатов', priority: 50, completed: false, subtasks: [] }
                    ]
                }
            ];
        }
        
        // Handle task clarification
        function handleTaskClarification(message) {
            const responses = [
                'Понял! Я обновил план задачи с учетом этой информации.',
                'Отлично, это поможет лучше структурировать задачу.',
                'Хорошо, я учту это при планировании следующих шагов.',
                'Спасибо за уточнение! Это важная деталь.'
            ];
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            addChatMessage('ai', randomResponse);
        }
        
        // Handle task completion reporting
        function handleTaskCompletion(message) {
            const task = tasks.find(t => t.id === activeTaskId);
            if (!task) {
                addChatMessage('ai', 'Выберите задачу, о которой идет речь.');
                return;
            }
            
            // Try to find which items were completed based on message
            const lowerMessage = message.toLowerCase();
            let completedCount = 0;
            
            function markCompleted(items) {
                items.forEach(item => {
                    if (!item.completed && lowerMessage.includes(item.title.toLowerCase().substring(0, 10))) {
                        item.completed = true;
                        completedCount++;
                    }
                    if (item.subtasks) {
                        markCompleted(item.subtasks);
                    }
                });
            }
            
            markCompleted(task.items);
            
            // Check if all items are completed
            function allCompleted(items) {
                return items.every(item => {
                    const itemDone = item.completed;
                    const subtasksDone = !item.subtasks || item.subtasks.length === 0 || allCompleted(item.subtasks);
                    return itemDone && subtasksDone;
                });
            }
            
            const isFullyCompleted = allCompleted(task.items);
            
            if (isFullyCompleted) {
                task.completed = true;
                addChatMessage('ai', `🎉 Отлично! Задача "${task.name}" полностью завершена! Поздравляю с успешным выполнением!`);
            } else if (completedCount > 0) {
                addChatMessage('ai', `Отметил ${completedCount} пункт(ов) как выполненные. Продолжайте в том же духе!`);
            } else {
                addChatMessage('ai', 'Отлично! Продолжайте работу над задачей. Какой следующий шаг?');
            }
            
            saveTask(task);
            renderTaskTree();
            renderTaskTabs();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('MSE Task Organizer initialized');
        });
    </script>
</body>
</html>
